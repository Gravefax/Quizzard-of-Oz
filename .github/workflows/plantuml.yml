name: Generate PlantUML Diagrams

on:
  push:
    branches:
      - dev
    paths:
      - 'docs/c4/**.puml'
  workflow_dispatch:

jobs:
  generate-diagrams:
    name: Generate SVG Diagrams
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install PlantUML
        run: |
          sudo apt-get install -y plantuml

      - name: Generate PlantUML SVGs
        run: |
          for f in docs/c4/*.puml; do
            plantuml -tsvg "$f"
          done

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet docs/c4/*.svg && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: regenerate PlantUML SVG diagrams [skip ci]"
          branch: chore/regenerate-plantuml-svgs
          title: "chore: regenerate PlantUML SVG diagrams"
          body: "Auto-generated by the Generate PlantUML Diagrams workflow."
          base: dev
          add-paths: docs/c4/*.svg
