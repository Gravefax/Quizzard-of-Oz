[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    # FastAPI intentionally uses Depends/Query calls as default values.
    "B008",
    # Existing test data and log messages often exceed the configured width.
    "E501",
]

[tool.pytest.ini_options]
markers = [
    "pentest: penetration / security tests probing the auth logic of protected endpoints",
    "security: security-relevant tests (authentication, sessions, access control)",
]

[tool.mypy]
python_version = "3.12"
files = ["app", "main.py"]
check_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
