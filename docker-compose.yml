services:
  postgres:
    image: postgres:18.3-trixie
    container_name: ${POSTGRES_CONTAINER_NAME:-quizbattle-db}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: quizbattle-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' 2>/dev/null && echo healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: quizbattle-backend
    restart: unless-stopped
    env_file: ./.env
    environment:
      POSTGRES_HOST: postgres
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend/quizzard-of-oz
      args:
        # NEXT_PUBLIC_API_BASE must be the backend URL reachable from the browser.
        # wsUrl.ts derives the WebSocket base from this value as well.
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_API_BASE: http://localhost:8000
        NEXT_PUBLIC_KEYCLOAK_URL: "http://localhost:8080"
        NEXT_PUBLIC_KEYCLOAK_REALM: "quizzard"
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: "quizzard-frontend"
    container_name: quizbattle-frontend
    restart: unless-stopped
    environment:
      API_SECRET: ${API_SECRET:-secret-token}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
